<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Thiranex Task 3 JavaScript To-Do List">
<title>TaskFlow — Thiranex Task 3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
<section class="card" aria-labelledby="title">
<header>
<p class="eyebrow">THIRANEX • TASK 3</p>
<h1 id="title">TaskFlow</h1>
<p class="sub">A simple, fast and persistent To-Do List.</p>
</header>

<form id="todo-form" class="add-form">
<label class="sr-only" for="todo-input">Add a task</label>
<input id="todo-input" maxlength="120" placeholder="What needs to be done?" required>
<button type="submit">Add Task</button>
</form>

<div class="toolbar">
<div class="filters" role="group" aria-label="Task filters">
<button type="button" class="filter active" data-filter="all">All</button>
<button type="button" class="filter" data-filter="active">Active</button>
<button type="button" class="filter" data-filter="completed">Completed</button>
</div>
<button type="button" id="clear-completed" class="text-btn">Clear completed</button>
</div>

<p id="task-count" class="count" aria-live="polite">0 tasks left</p>
<ul id="todo-list" class="todo-list" aria-label="To-do items"></ul>

<div class="empty" id="empty-state">
<div class="empty-icon">✓</div>
<h2 id="empty-title">No tasks yet</h2>
<p id="empty-text">Add your first task above.</p>
</div>
</section>
</main>
<script src="js/script.js"></script>
</body>
</html>
